<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=800, user-scalable=yes, minimum-scale=0.2, maximum-scale=10"/>
<title>Form Maintenance Gate dan Faceprint</title>
<link rel="stylesheet" href="../assets/form.css"/>
</head>
<body>
<div class="sheet">
  <div class="form-outer">
  <table class="header-table">
  <tr>
    <td class="cell-logo">
      <div class="logo-wrap">
        <img class="logo-img" src="https://lh3.googleusercontent.com/d/1-d2Km1jPqMdssikTLrKGc7q7m0qToqKb" onerror="this.onerror=null;this.src='https://drive.google.com/uc?export=view&id=1-d2Km1jPqMdssikTLrKGc7q7m0qToqKb'" alt="IMIP Logo"/>
      </div>
    </td>
    <td class="cell-title">FORM MAINTENANCE GATE DAN FACEPRINT</td>
    <td class="cell-meta">
      <table class="meta-table">
        <tr><td>No. Dokumen</td><td class="meta-val">: IMIP-<input type="text" style="width:50px"/></td></tr>
        <tr><td>Revisi</td><td class="meta-val">: <input type="text" style="width:40px" value="0"/></td></tr>
        <tr><td>Tanggal Efektif</td><td class="meta-val">: <input type="text" style="width:78px"/></td></tr>
      </table>
    </td>
  </tr>
  </table>

  <table class="info-single">
    <tr><td class="lbl">Tanggal</td><td class="sep">:</td><td><input type="text"/></td></tr>
    <tr><td class="lbl">Lokasi Perangkat</td><td class="sep">:</td><td><input type="text"/></td></tr>
    <tr><td class="lbl">Jumlah Perangkat</td><td class="sep">:</td><td><input type="text"/></td></tr>
  </table>

  <!-- ══ CHECKLIST GATE & FACEPRINT ══ -->
  <table class="tbl" style="table-layout:fixed;" id="acTable">
  <colgroup>
    <col style="width:4%"/><col style="width:40%"/><col style="width:7%"/><col style="width:7%"/><col style="width:21%"/><col style="width:21%"/>
  </colgroup>
  <thead>
    <tr>
      <th rowspan="2" class="tc-center">&nbsp;</th>
      <th rowspan="2" style="text-align:left; padding-left:6px">Spesifikasi</th>
      <th colspan="2" class="tc-center">KONDISI</th>
      <th rowspan="2">KETERANGAN</th>
      <th rowspan="2">SARAN</th>
    </tr>
    <tr><th class="tc-center">N</th><th class="tc-center">R</th></tr>
  </thead>
  <tbody id="acBody"></tbody>
  </table>

  <div class="box" style="min-height:52px">
    <div class="box-title">KETERANGAN UMUM :</div>
    <textarea class="ket-area" rows="3"></textarea>
  </div>

  <!-- ══ TANDA TANGAN 2 KOLOM ══ -->
  <div class="sign-wrap">
    <div class="sign-grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="sign-col"><div class="sign-role">DI KETAHUI OLEH :<br>KOORDINATOR IT HARDWARE</div><div class="sign-space"></div><div class="sign-name-wrap"><span class="sp">(</span><input type="text" class="sign-input"/><span class="sp">)</span></div></div>
      <div class="sign-col"><div class="sign-role">PELAKSANA :<br>TEKNISI</div><div class="sign-space"></div><div class="sign-name-wrap"><span class="sp">(</span><input type="text" class="sign-input"/><span class="sp">)</span></div></div>
    </div>
  </div>
  </div>
</div>

<script src="../assets/form.js"></script>
<script>
(function(){
  /* ── data checklist sesuai PDF (perangkat + sub-item spesifikasi) ── */
  const groups = [
    { no:1, name:"Gate FBL 2000",  items:["SENSOR","MEKANIKAL","MAINBOARD"] },
    { no:2, name:"Gate FBL 2200",  items:["SENSOR","MEKANIKAL","MAINBOARD"] },
    { no:3, name:"INBIOPRO 260",   items:["PENGKABELAN","CONNECTION"] },
    { no:4, name:"GATE CMP200",    items:["MEKANIKAL","MAINBOARD","INSTLASI"] },
    { no:5, name:"SENSOR VR10 PRO",items:["JARAK/AREA","CONNECTION"] },
    { no:6, name:"QR500",          items:["SCAN","CONNECTION"] },
    { no:7, name:"GATE TURNSTILE", items:["MEKANIKAL","MAINBOARD"] },
    { no:8, name:"UHF10 PRO",      items:["JARAK/AREA","SENSITIFITAS"] },
    { no:9, name:"PROFACE X",      items:["KAMERA","DATA"] }
  ];

  let html = '<tr><td colspan="6" style="font-weight:700; padding-left:6px">A. HARDWARE</td></tr>';
  let rowId = 0;
  groups.forEach(g => {
    html += '<tr><td class="tc-center">' + g.no + '</td><td style="font-weight:700; padding-left:6px">' + g.name + '</td><td></td><td></td><td></td><td></td></tr>';
    g.items.forEach(it => {
      html += '<tr><td></td><td style="padding-left:16px">' + it + '</td>' +
        '<td class="tc-center"><input type="checkbox" class="cond-cb" data-row="' + rowId + '"/></td>' +
        '<td class="tc-center"><input type="checkbox" class="cond-cb" data-row="' + rowId + '"/></td>' +
        '<td><input type="text"/></td><td><input type="text"/></td></tr>';
      rowId++;
    });
  });
  document.getElementById("acBody").innerHTML = html;

  /* N / R pilihan tunggal per baris */
  document.getElementById("acTable").addEventListener("change", e => {
    if (!e.target.classList.contains("cond-cb")) return;
    const row = e.target.dataset.row;
    const cbs = document.querySelectorAll('#acTable .cond-cb[data-row="' + row + '"]');
    if (e.target.checked) cbs.forEach(c => { if (c !== e.target) c.checked = false; });
  });
})();
</script>
</body>
</html>
